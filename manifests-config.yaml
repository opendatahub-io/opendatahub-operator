# Image overrides — pinned operator image digests, keyed by RELATED_IMAGE_* env var name.
# Local directories symlinked into opt/manifests/ during development.
# In container builds, these are COPYed directly in the Dockerfile.
platformManifests:
  osd-configs: config/osd-configs
  hardwareprofiles: config/hardwareprofiles
  connectionAPI: config/connectionAPI
  segment: config/segment
#   component:    which component's SHA to use for tagTemplate (matches key in components/ccmCharts/componentCharts)
#   paramsEnvKey: (optional) params.env key for Go runtime
#   tagTemplate:  (optional) must contain {SHA} and/or {SHORT_SHA}; prefixes and suffixes are allowed (quote the value)
#   odh/rhoai:    per-platform base image, digest, and optional shaFrom
