# Image overrides — pinned operator image digests, keyed by RELATED_IMAGE_* env var name.
# Local directories symlinked into opt/manifests/ during development.
# In container builds, these are COPYed directly in the Dockerfile.
platformManifests:
  osd-configs: config/osd-configs
  hardwareprofiles: config/hardwareprofiles
  connectionAPI: config/connectionAPI
  segment: config/segment
