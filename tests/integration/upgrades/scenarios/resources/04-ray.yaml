apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: gate-unbacked-raycluster
  namespace: gate-scenarios
  finalizers:
  - ray.openshift.ai/oauth-finalizer
spec:
  rayVersion: '2.9.0'
  headGroupSpec:
    rayStartParams: {}
    template:
      spec:
        containers:
        - name: ray-head
          image: rayproject/ray:2.9.0
  workerGroupSpecs:
  - groupName: workers
    replicas: 0
    minReplicas: 0
    maxReplicas: 0
    rayStartParams: {}
    template:
      spec:
        containers:
        - name: ray-worker
          image: rayproject/ray:2.9.0

