apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
{{- $package := index . "Package" }}
{{- $channel := index . "Channel" }}
{{- if or $package $channel }}
spec:
{{- if $package }}
  name: {{ $package }}
{{- end }}
{{- if $channel }}
  channel: {{ $channel }}
{{- end }}
{{- end }}
{{- if .InstalledCSV }}
status:
  installedCSV: {{ .InstalledCSV }}
{{- end }}
