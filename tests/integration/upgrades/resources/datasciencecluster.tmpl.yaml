apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: {{ .Name }}
{{- if .ManagedComponents }}
spec:
  components:
{{- range .ManagedComponents }}
    {{ . }}:
      managementState: Managed
{{- end }}
{{- end }}
{{- if .Version }}
status:
  release:
    name: {{ .Platform }}
    version: "{{ .Version }}"
{{- end }}
