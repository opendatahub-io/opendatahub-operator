apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-module-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: synthetic-module-operator
  template:
    metadata:
      labels:
        control-plane: synthetic-module-operator
    spec:
      serviceAccountName: synthetic-module-operator
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: synthetic-module-operator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: APPLICATIONS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8443
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
