apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: synthetic-module-operator
rules:
  - apiGroups: ["synthetic.platform.opendatahub.io"]
    resources: ["syntheticmodules", "syntheticmodules/status", "syntheticmodules/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: synthetic-module-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: synthetic-module-operator
subjects:
  - kind: ServiceAccount
    name: synthetic-module-operator
    namespace: {{ .Values.namespace }}
