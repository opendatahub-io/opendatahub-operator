apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: data-science-collector-tempo-trace-export
rules:
- apiGroups:
  - tempo.grafana.com
  resources:
  - {{ .Namespace }}
  resourceNames:
  - traces
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: data-science-collector-tempo-trace-export
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: data-science-collector-tempo-trace-export
subjects:
- kind: ServiceAccount
  name: data-science-collector-collector
  namespace: {{ .Namespace }}
