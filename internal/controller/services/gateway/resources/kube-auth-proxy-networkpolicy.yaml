---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{.KubeAuthProxyServiceName}}
  namespace: {{.GatewayNamespace}}
  labels:
    app: {{.KubeAuthProxyServiceName}}
    {{.ComponentLabelKey}}: {{.ComponentLabelValue}}
spec:
  podSelector:
    matchLabels:
      app: {{.KubeAuthProxyServiceName}}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from gateway/envoy pods for authentication
    - from:
      - podSelector:
          matchExpressions: # match the gateway-name label added to gateway pods
            - key: {{.GatewayNameLabelKey}}
              operator: In
              values:
{{range .GatewayFilters}}                - {{.GatewayName}}
{{end}}
        namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: {{.GatewayNamespace}}
      ports:
        - protocol: TCP
          port: {{.GatewayHTTPSPort}}

  # DNS, Kubernetes API when required by the auth mode, and external HTTPS.
  # An empty list denies all egress until required cluster ranges are known.
  egress:{{toYaml .AuthProxyEgressRules | nindent 4}}
