apiVersion: v1
kind: ConfigMap
metadata:
  name: operator-config
data:
  configured: "true"
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: operator-lock
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
spec:
  selector:
    matchLabels:
      app: operator
  template:
    metadata:
      labels:
        app: operator
    spec:
      containers:
      - name: operator
        image: example.com/operator:latest
