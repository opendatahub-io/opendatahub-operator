# Test-only webhook definitions for envtest integration tests.
# Production OLM no longer installs platform notebook webhooks once the
# workbenches module owns them; envtest still needs API-server wiring so
# notebook webhook integration tests exercise real admission paths.
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: envtest-notebook-webhooks
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-hardware-profile
  failurePolicy: Fail
  name: hardwareprofile-notebook-injector.opendatahub.io
  rules:
  - apiGroups:
    - kubeflow.org
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - notebooks
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /platform-connection-notebook
  failurePolicy: Fail
  name: connection-notebook.opendatahub.io
  rules:
  - apiGroups:
    - kubeflow.org
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - notebooks
  sideEffects: None
