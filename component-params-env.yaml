# Configuration for validate-related-images.sh.
#
# rhai_helm_components: components whose RELATED_IMAGE_* must also be present
#   in RHOAI-Build-Config helm/rhai-on-xks-chart/values.yaml (rhaiOperator.relatedImages).
# odh_exceptions: RELATED_IMAGE entries intentionally absent from ODH-Build-Config.
#   These are permanently excluded from ODH validation (e.g. architecture-specific images).
# rhoai_exceptions: RELATED_IMAGE entries intentionally absent from RHOAI-Build-Config.
#   These are permanently excluded from RHOAI validation (e.g. ODH-only images).
# known_issues: RELATED_IMAGE errors to downgrade to warnings.
#   Each entry MUST include a Jira link and reason.

rhai_helm_components:
  - kserve
  - aigateway

# Example:
# - image: RELATED_IMAGE_ODH_ML_PIPELINES_RUNTIME_GENERIC_IMAGE
#   jira: https://issues.redhat.com/browse/RHOAIENG-XXXXX
#   reason: Deprecated image, removal tracked in Jira
known_issues:
- image: RELATED_IMAGE_ODH_ML_PIPELINES_RUNTIME_GENERIC_IMAGE
  jira: https://redhat.atlassian.net/browse/RHOAIENG-60396
  reason: Removed with InstrutLab pipeline removal since RHOAI 3.0
- image: RELATED_IMAGE_DSP_INSTRUCTLAB_NVIDIA_IMAGE
  jira: https://redhat.atlassian.net/browse/RHOAIENG-60396
  reason: Removed with InstrutLab pipeline removal since RHOAI 3.0
- image: RELATED_IMAGE_DSP_TOOLBOX_IMAGE
  jira: https://redhat.atlassian.net/browse/RHOAIENG-60396
  reason: Removed with InstrutLab pipeline removal since RHOAI 3.0

odh_exceptions:
- image: RELATED_IMAGE_ODH_VLLM_CPU_IMAGE
  reason: ppc64le/s390x only, not applicable to ODH
- image: RELATED_IMAGE_ODH_TRAINING_OPERATOR_IMAGE
  jira: https://redhat.atlassian.net/browse/RHOAIENG-78350
  reason: it must be offboarded in rhoai 3.6, already offboarded in ODH-Build-Config
- image: RELATED_IMAGE_RHAII_MODEL_OPT_CUDA_IMAGE
  reason: RHOAI-only image, not applicable to ODH
- image: RELATED_IMAGE_RHAII_VLLM_CUDA_IMAGE
  reason: RHOAI-only image, not applicable to ODH

rhoai_exceptions:
- image: RELATED_IMAGE_ODH_VLLM_CPU_FAST_1_IMAGE
  reason: ODH-only image, not applicable to RHOAI
- image: RELATED_IMAGE_ODH_VLLM_CPU_FAST_2_IMAGE
  reason: ODH-only image, not applicable to RHOAI
- image: RELATED_IMAGE_ODH_TRAINER_OPERATOR_IMAGE
  jira: https://redhat.atlassian.net/browse/RHOAIENG-62940
  reason: Trainer module operator image, not yet in RHOAI-Build-Config, delivering in RHOAI 3.6 EA1
- image: RELATED_IMAGE_ODH_SPARK_OPERATOR_MODULE_IMAGE
  jira: https://redhat.atlassian.net/browse/RHOAIENG-69125
  reason: Spark Operator module image, not yet in RHOAI-Build-Config, delivering in RHOAI 3.6 EA1
- image: RELATED_IMAGE_RHAII_MODEL_OPT_CUDA_IMAGE
  reason: Not yet on rhoai-3.5 branch, merged to rhoai-3.6-ea.1
- image: RELATED_IMAGE_RHAII_VLLM_CUDA_IMAGE
  reason: Not yet on rhoai-3.5 branch, merged to rhoai-3.6-ea.1
