name: TLS Config Lint
on:
  pull_request:
    branches: [main, master, dev, odh, incubating, stable, stable-2.x]

permissions:
  contents: read
  security-events: write

jobs:
  tls-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sebrandon1/tls-config-lint@8ab3080f289b58d6c0d1211402a75e1316349f5d # v1.2.1
        id: lint
        with:
          severity-threshold: high
          sarif-output: tls-lint.sarif
          exclude-dirs: vendor,node_modules,test/fixtures
          # tls-profile-old (HIGH) and tls-profile-custom (MEDIUM) fire as
          # structural false positives in OCP TLS compliance resolver code
          # (any switch over all TLSSecurityProfile types). Re-enable once
          # org-wide TLS compliance work is complete and findings are validated.
          # exclude-patterns: tls-profile-old,tls-profile-custom

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: tls-lint.sarif
