name: Update Manifest SHAs

on:
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update-manifest-shas:
    runs-on: ubuntu-latest
    # Job only runs if the current branch reference is 'refs/heads/main'.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@7e473efe3cb98aa54f8d4bac15400b15fad77d94 # v2.2.0
        with:
          app-id: ${{ secrets.ODH_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.ODH_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod

      - name: Update manifest SHAs
        id: update-shas
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: GITHUB_TOKEN=$GITHUB_TOKEN make update-refs-shas

      - name: Update cloud manager RBAC
        if: steps.update-shas.outputs.updates-needed == 'true'
        run: make update-cloudmanager-rbac

      - name: Resolve image digests
        if: steps.update-shas.outputs.updates-needed == 'true'
        run: make resolve-image-digests

      - name: Create Pull Request
        if: steps.update-shas.outputs.updates-needed == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        id: create-pr
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: "chore: update manifest commit SHAs"
          labels: "auto-bump-manifests-and-images${{ steps.update-shas.outputs.fetch-failed == 'true' && ',do-not-merge' || '' }}"
          title: "chore: update manifest commit SHAs"
          body: |
            This PR updates the manifest commit SHAs to the latest available commits.
            ${{ steps.update-shas.outputs.fetch-failed == 'true' && format('

            > [!WARNING]
            > These components failed to fetch from GitHub and were **not** updated:
            > `{0}`

            The scheduled workflow run is marked as failed. Please investigate.', steps.update-shas.outputs.failed-components) || '' }}
          branch: sync/upgrade-manifest-shas
          delete-branch: true

      - name: Fail if any SHA fetches failed
        if: steps.update-shas.outputs.fetch-failed == 'true'
        env:
          FAILED_COMPONENTS: ${{ steps.update-shas.outputs.failed-components }}
        run: |
          printf '::error::Some component SHA fetches failed: %s\n' "$FAILED_COMPONENTS"
          exit 1

      - name: Output Summary
        if: steps.update-shas.outputs.updates-needed == 'true'
        run: |
          echo "✅ Updates processed successfully"
          if [[ "${{ steps.create-pr.outputs.pull-request-operation }}" == "created" ]]; then
            echo "📋 Pull request created: ${{ steps.create-pr.outputs.pull-request-url }}"
            echo "📋 Pull request number: #${{ steps.create-pr.outputs.pull-request-number }}"
          elif [[ "${{ steps.create-pr.outputs.pull-request-operation }}" == "updated" ]]; then
            echo "📋 Pull request updated: ${{ steps.create-pr.outputs.pull-request-url }}"
          else
            echo "📋 No pull request changes needed"
          fi
