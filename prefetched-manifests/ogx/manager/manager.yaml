apiVersion: v1
kind: Namespace
metadata:
  name: system
  labels:
    app.kubernetes.io/name: opendatahub-ogx-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  namespace: system
  labels:
    app.kubernetes.io/name: opendatahub-ogx-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: opendatahub-ogx-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: opendatahub-ogx-operator
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-manifests
          image: controller:latest
          imagePullPolicy: Always
          command:
            - cp
            - -r
            - /manifests/.
            - /opt/manifests/
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: manifests
              mountPath: /opt/manifests
      containers:
        - name: manager
          image: controller:latest
          imagePullPolicy: Always
          command:
            - /manager
          args:
            - --leader-elect
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/controller/config
              readOnly: true
            - name: manifests
              mountPath: /opt/manifests
          env:
            - name: ODH_MODULE_OPERATOR_CONFIGURATION_PATH
              value: /etc/controller/config
            - name: ODH_MODULE_OPERATOR_MANIFESTS_PATH
              value: /opt/manifests
            - name: RELATED_IMAGE_ODH_OGX_K8S_OPERATOR_IMAGE
              value: ""
            - name: RELATED_IMAGE_ODH_OGX_CORE_IMAGE
              value: ""
            - name: ODH_MODULE_OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ODH_MODULE_OPERATOR_APPLICATIONS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APPLICATIONS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RHAI_APPLICATIONS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      volumes:
        - name: manifests
          emptyDir: {}
        - name: config
          configMap:
            name: config
      serviceAccountName: operator
      terminationGracePeriodSeconds: 10
