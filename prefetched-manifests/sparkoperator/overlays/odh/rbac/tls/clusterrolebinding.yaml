apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spark-operator-tls-profile
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spark-operator-tls-profile
subjects:
  - kind: ServiceAccount
    name: spark-operator-controller
    namespace: system
  - kind: ServiceAccount
    name: spark-operator-webhook
    namespace: system
