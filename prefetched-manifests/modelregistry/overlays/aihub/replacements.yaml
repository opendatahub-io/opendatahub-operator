# replacements from configmap using params.env for use in opendatahub-operator
- source:
    kind: ConfigMap
    name: aihub-controller-parameters
    fieldPath: data.RELATED_IMAGE_ODH_MODEL_REGISTRY_OPERATOR_IMAGE
  targets:
    - select:
        kind: Deployment
        name: aihub-controller-manager
      fieldPaths:
        - spec.template.spec.containers.[name=manager].image
- source:
    kind: ConfigMap
    name: aihub-controller-parameters
    fieldPath: data.RELATED_IMAGE_ODH_MODEL_REGISTRY_OPERATOR_IMAGE
  targets:
    - select:
        kind: Deployment
        name: aihub-controller-manager
      fieldPaths:
        - spec.template.spec.containers.[name=manager].env.[name=RELATED_IMAGE_ODH_MODEL_REGISTRY_OPERATOR_IMAGE].value
