- source:
    kind: Service
    name: aihub-controller-manager-metrics-service
    fieldPath: metadata.name
  targets:
    - select:
        kind: ServiceMonitor
        name: aihub-controller-manager-metrics-monitor
      fieldPaths:
        - spec.endpoints.0.tlsConfig.serverName
      options:
        delimiter: "."
        index: 0
