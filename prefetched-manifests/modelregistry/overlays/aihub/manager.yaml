---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aihub-controller-manager
  labels:
    app.kubernetes.io/name: aihub-controller-manager
    app.kubernetes.io/component: controller
    control-plane: aihub-controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: aihub-controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aihub-controller-manager
        app.kubernetes.io/component: controller
        control-plane: aihub-controller-manager
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: aihub-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: manager
        image: quay.io/opendatahub/model-registry-operator:latest
        command:
          - /manager
        args:
        - "aihub"
        - "--leader-elect"
        - "--metrics-cert-dir=/tmp/k8s-metrics-server/serving-certs"
        - "--metrics-cert-name=tls.crt"
        - "--metrics-key-name=tls.key"
        env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: RELATED_IMAGE_ODH_MODEL_REGISTRY_OPERATOR_IMAGE
            value: quay.io/opendatahub/model-registry-operator:latest
          - name: RELATED_IMAGE_ODH_MODEL_REGISTRY_IMAGE
            value: quay.io/opendatahub/model-registry:latest
          - name: RELATED_IMAGE_POSTGRESQL_16_IMAGE
            value: quay.io/sclorg/postgresql-16-c10s:latest
          - name: RELATED_IMAGE_ODH_KUBE_RBAC_PROXY_IMAGE
            value: quay.io/openshift/origin-kube-rbac-proxy:latest
          - name: RELATED_IMAGE_ODH_MODEL_METADATA_COLLECTION_IMAGE
            value: quay.io/opendatahub/odh-model-metadata-collection:latest
          - name: RELATED_IMAGE_ODH_MODEL_PERFORMANCE_DATA_IMAGE
            value: quay.io/opendatahub/odh-model-metadata-collection:latest
          - name: RELATED_IMAGE_ODH_MODEL_REGISTRY_JOB_ASYNC_UPLOAD_IMAGE
            value: quay.io/opendatahub/model-registry-job-async-upload:latest
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 10
          httpGet:
            path: /healthz
            port: 8081
        readinessProbe:
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 15
          httpGet:
            path: /readyz
            port: 8081
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - name: manifests
          mountPath: /opt/manifests
        - name: tmp
          mountPath: /tmp
        - name: trusted-ca
          mountPath: /etc/pki/tls/custom
          readOnly: true
        - name: metrics-certs
          mountPath: /tmp/k8s-metrics-server/serving-certs
          readOnly: true
      volumes:
      - name: manifests
        emptyDir:
          sizeLimit: 256Mi
      - name: tmp
        emptyDir: {}
      - name: trusted-ca
        configMap:
          name: odh-trusted-ca-bundle
          optional: true
      - name: metrics-certs
        secret:
          secretName: aihub-controller-manager-metrics-tls
