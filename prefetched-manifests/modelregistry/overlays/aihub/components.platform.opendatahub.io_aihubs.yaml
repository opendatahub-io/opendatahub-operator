---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: aihubs.components.platform.opendatahub.io
spec:
  group: components.platform.opendatahub.io
  names:
    kind: AIHub
    listKind: AIHubList
    plural: aihubs
    singular: aihub
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.applicationNamespace
      name: AppNamespace
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AIHub is the module CR that the platform creates to manage the
          AI Hub.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AIHubSpec defines the desired state of AIHub.
            properties:
              applicationNamespace:
                description: |-
                  ApplicationNamespace is the namespace where the child operators (model registry
                  and catalog operators) run.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              gateway:
                description: |-
                  Gateway carries Data Science Gateway settings projected by the platform.
                  Optional: absent until the gateway domain is available.
                properties:
                  domain:
                    description: |-
                      Domain is the Data Science Gateway wildcard domain used to build
                      per-instance HTTPRoute hostnames.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$
                    type: string
                type: object
              instancesNamespace:
                description: |-
                  InstancesNamespace is the namespace where model registry instances, the catalog
                  service, and the Catalog CR are deployed. It is sourced from the DSC field
                  spec.components.modelregistry.registriesNamespace and MAY equal ApplicationNamespace.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
            required:
            - applicationNamespace
            - instancesNamespace
            type: object
          status:
            description: AIHubStatus defines the observed state of AIHub.
            properties:
              conditions:
                description: Conditions is the set of condition observations for this
                  module.
                items:
                  description: |-
                    Condition represents an observation of a module's state at a point in time.
                    Module controllers set conditions to communicate health signals to the
                    orchestrator and to human operators.
                  properties:
                    lastHeartbeatTime:
                      description: |-
                        Deprecated: LastHeartbeatTime is present only for backward
                        compatibility with existing CRDs. New code should not set this field.
                      format: date-time
                      type: string
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from
                        one status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human-readable message indicating details about the
                        transition.
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the
                        condition was set based upon. If this does not match the resource's
                        current generation, the condition is likely stale.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for
                        the condition's last transition. The value should be a CamelCase
                        string.
                      type: string
                    severity:
                      description: |-
                        Severity indicates whether this condition represents an error or is
                        purely informational. Empty string (default) indicates error severity.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent .metadata.generation observed
                  by the controller. It allows consumers to determine whether the
                  controller has processed the latest spec changes.
                format: int64
                type: integer
              phase:
                description: Phase is the top-level lifecycle phase of the module.
                type: string
              releases:
                description: Releases is the list of deployed component releases.
                items:
                  description: ComponentRelease describes a single software component's
                    release metadata.
                  properties:
                    name:
                      description: Name is the component name, used as the merge key
                        in lists.
                      type: string
                    repoUrl:
                      description: RepoURL is the source repository URL for this component
                        release.
                      type: string
                    version:
                      description: Version is the semantic version of the component.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: Only the name 'default-aihub' is allowed
          rule: self.metadata.name == 'default-aihub'
    served: true
    storage: true
    subresources:
      status: {}
