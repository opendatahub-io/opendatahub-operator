# replacements from configmap using params.env for use in opendatahub-operator
- source:
    kind: ConfigMap
    name: catalog-operator-parameters
    fieldPath: data.IMAGES_MODELREGISTRY_OPERATOR
  targets:
    - select:
        kind: Deployment
        name: catalog-controller-manager
      fieldPaths:
        - spec.template.spec.containers.[name=manager].image
- source:
    kind: ConfigMap
    name: catalog-operator-parameters
    fieldPath: data.kube-rbac-proxy
  targets:
    - select:
        kind: Deployment
        name: catalog-controller-manager
      fieldPaths:
        - spec.template.spec.containers.[name=manager].env.[name=KUBE_RBAC_PROXY_IMAGE].value
