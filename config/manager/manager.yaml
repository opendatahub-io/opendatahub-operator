              cpu: 1000m
              memory: 4Gi
            requests:
              cpu: 100m
              memory: 780Mi
          volumeMounts:
            - name: manifests
              mountPath: /opt/manifests
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: manifests
