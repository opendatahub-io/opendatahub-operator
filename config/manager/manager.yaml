apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    name: opendatahub-operator
    control-plane: controller-manager
spec:
  selector:
    matchLabels:
      name: opendatahub-operator
      control-plane: controller-manager
  replicas: 3
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        openshift.io/required-scc: restricted-v2
      labels:
        name: opendatahub-operator
        control-plane: controller-manager
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: name
                      operator: In
                      values:
                        - opendatahub-operator
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-manifests
          # NOTE: image is provided in CI by pullspec substitution, and by make/kustomize for local builds
          image: REPLACE_IMAGE:v0.0.0-placeholder
          imagePullPolicy: Always
          command: ["cp", "-r", "/opt/manifests-template/.", "/opt/manifests/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: manifests
              mountPath: /opt/manifests
      containers:
        - command:
            - /manager
          env:
            - name: DISABLE_DSC_CONFIG
              value: 'true'
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DEFAULT_MANIFESTS_PATH
              value: /opt/manifests
            - name: DEFAULT_CHARTS_PATH
              value: /opt/charts
            - name: ODH_PLATFORM_TYPE
              value: OpenDataHub
