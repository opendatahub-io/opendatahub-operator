apiVersion: datasciencecluster.opendatahub.io/v3
kind: DataScienceCluster
metadata:
  name: default-dsc
  labels:
    app.kubernetes.io/name: datasciencecluster
spec:
  components:
    aigateway:
      managementState: "Removed"
      modelsAsAService:
        managementState: "Removed"
      batchGateway:
        managementState: "Removed"
    dashboard:
      standard:
        managementState: "Managed"
      maasPortal:
        managementState: "Removed"
    aipipelines:
      managementState: "Managed"
    kserve:
      managementState: "Managed"
      nim:
        managementState: "Managed"
      modelExpress:
        managementState: "Removed"
    kueue:
      managementState: "Removed"
    trainer:
      managementState: "Managed"
    ray:
      managementState: "Managed"
    workbenches:
      managementState: "Managed"
      workbenchesV2:
        managementState: "Removed"
    trustyai:
      managementState: "Managed"
    aiHub:
      managementState: "Managed"
      instancesNamespace: "rhoai-model-registries"
    data:
      featureStore:
        managementState: "Managed"
      dataConnectHub:
        managementState: "Removed"
        # To enable DCH, set managementState to "Managed". Optional overrides:
        # gateway:
        #   name: data-science-gateway
        #   namespace: openshift-ingress
        # tokenReviewAudiences:
        #   - https://issuer.example.com
    ogx:
      managementState: "Managed"
    mlflowoperator:
      managementState: "Managed"
    sparkoperator:
      managementState: "Removed"
    mcplifecycleoperator:
      managementState: "Managed"
    databaseservice:
      managementState: "Removed"
