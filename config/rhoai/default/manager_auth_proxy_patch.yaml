# This patch configures the controller manager with SecureServing metrics
# and service-ca certificate provisioning on OpenShift.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhods-operator
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: rhods-operator
        args:
        - "--health-probe-bind-address=:8081"
        - "--metrics-bind-address=:8443"
        - "--metrics-secure=true"
        - "--metrics-cert-path=/etc/metrics-certs"
        - "--leader-elect"
        volumeMounts:
        - name: metrics-cert
          mountPath: /etc/metrics-certs
          readOnly: true
      volumes:
      - name: metrics-cert
        secret:
          secretName: rhods-operator-metrics-tls  # pragma: allowlist secret
