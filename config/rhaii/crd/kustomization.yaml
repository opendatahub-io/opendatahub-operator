apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- bases/

patches:
- target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: platforms.config.opendatahub.io
  path: patches/webhook_in_config_platforms.yaml
- target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: platforms.config.opendatahub.io
  path: patches/cainjection_in_config_platforms.yaml

configurations:
- kustomizeconfig.yaml
