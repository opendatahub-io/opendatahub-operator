---
# ValidatingAdmissionPolicy to warn when PostgreSQL connection secrets are missing required ADR-0017 fields
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: connectionapi-check-postgres-fields
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  validations:
    # Warn if secret has postgres connection type but is missing or has an empty value for any always-required field.
    # schema is omitted (SchemaClaim-only) and ca.crt is omitted (conditional on the provider presenting a CA).
    - expression: >-
        !has(object.metadata.annotations) ||
        !('opendatahub.io/connection-type-protocol' in object.metadata.annotations &&
          object.metadata.annotations['opendatahub.io/connection-type-protocol'] == 'postgres') ||
        (
          has(object.data) &&
          ['host', 'port', 'user', 'password', 'dbname', 'sslmode'].all(k, k in object.data && size(object.data[k]) > 0)
        )
      messageExpression: >-
        "Secret '" + object.metadata.name + "' has postgres connection type annotation but is missing one or more required data keys (host, port, user, password, dbname, sslmode) or has empty string values for them"
      reason: Invalid

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: connectionapi-check-postgres-fields-binding
spec:
  policyName: connectionapi-check-postgres-fields
  validationActions: ["Warn"]  # Only warn, don't deny creation or update and dont care which namespace the secret is in.
